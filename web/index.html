<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Background Generator Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <link rel="stylesheet" href="./styles.css" />
    <main class="background-generator-app">
      <section>
        <h1>Generator Controls</h1>
        <form data-role="generator-form">
          <label>
            Generator
            <select data-role="generator-select"></select>
          </label>
          <div data-role="dynamic-fields"></div>
          <button type="submit">Generate</button>
          <button type="button" data-role="cancel-generation" disabled>Cancel</button>
        </form>
      </section>
      <section class="preview-panel">
        <header>
          <div>
            <strong>Preview</strong>
            <div data-role="meta"></div>
          </div>
          <div class="preview-actions">
            <button type="button" data-role="download-svg" disabled>
              Download SVG
            </button>
            <button type="button" data-role="download-png" disabled>
              Download PNG
            </button>
          </div>
        </header>
        <div class="preview-area" data-role="preview">
          Fill out the form and generate a scene.
        </div>
        <label>
          SVG Markup
          <textarea data-role="svg-output" readonly></textarea>
        </label>
      </section>
    </main>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
